<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}KRYPT{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#FCFCFD;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FCFCFD;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#FFFFFF;border:1px solid #EAECF0;border-radius:12px;">
        <tr>
          <!-- En-tête sur fond blanc (pas de bandeau de couleur plate) — logo
               KRYPT + nom, même agencement que la Sidebar de l'app. -->
          <td style="background-color:#FFFFFF;padding:24px 32px;border-bottom:1px solid #EAECF0;border-radius:12px 12px 0 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="vertical-align:middle;padding-right:8px;">
                  <img src="cid:logo_krypt" width="28" height="28" alt="KRYPT" style="display:block;border:0;">
                </td>
                <td style="vertical-align:middle;">
                  <span style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;color:#00214F;letter-spacing:0.3px;">KRYPT</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;font-family:Arial,Helvetica,sans-serif;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px;background-color:#FCFCFD;border-top:1px solid #EAECF0;border-radius:0 0 12px 12px;font-family:Arial,Helvetica,sans-serif;">
            <p style="margin:0;font-size:12px;line-height:1.5;color:#667085;">KRYPT — transferts internationaux rapides et transparents.</p>
            <p style="margin:4px 0 0;font-size:12px;line-height:1.5;color:#667085;">Cet email transactionnel vous est envoyé car vous avez un compte KRYPT et concerne une action ou un statut sur votre compte.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
