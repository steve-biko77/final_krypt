[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py tests_*.py
markers =
    integration: hits real external services (Stripe sandbox) — excluded by default, run explicitly with `pytest -m integration`
    e2e_real: runs the full transfer flow against real external services (Stripe/Amoy/MTN sandboxes) for demo purposes — distinct from `integration` (single-adapter checks); excluded by default, run explicitly with `pytest -m e2e_real`
