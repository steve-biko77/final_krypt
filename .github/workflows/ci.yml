name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Job 1 — Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Python / flake8 ───────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: flake8 — backend
        run: flake8 . --exclude=venv,.venv,migrations --max-line-length=119
        working-directory: backend

      # ── Node / ESLint ─────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint — frontend
        run: npx next lint --no-cache --max-warnings=5
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Job 2 — Tests
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: krypt_test
          POSTGRES_USER: krypt
          POSTGRES_PASSWORD: krypt_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Broker Celery — CELERY_TASK_ALWAYS_EAGER n'existe pas comme mécanisme
      # global dans ce projet (aucune variable d'environnement ne le pilote ;
      # seuls 2 tests de contexts/compliance/tests.py l'activent ponctuellement
      # via @override_settings). En local, les tests passent parce qu'un vrai
      # Redis tourne déjà via `docker-compose up` (voir docker-compose.yml) —
      # rien de tel en CI, d'où `redis.exceptions.ConnectionError` dès qu'un
      # test déclenche .delay() sans le mocker (ex: inscription -> notification_task
      # .delay() dans contexts/identity/adapters/api/views.py). Même pattern que
      # le service postgres ci-dessus.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ── Django tests ──────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run Django tests
        run: python manage.py test --verbosity=2
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: ci-insecure-secret-key-for-testing-only
          DB_NAME: krypt_test
          DB_USER: krypt
          DB_PASSWORD: krypt_secret
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci_minio_key
          MINIO_SECRET_KEY: ci_minio_secret

      # ── KRYP-37 : visibilité dédiée du temps du test E2E (mode mocké) ─
      # Déjà exécuté ci-dessus par `manage.py test` (couverture bloquante) ;
      # ce step ne fait que le ré-exécuter seul via pytest --durations pour que
      # son temps ne soit pas noyé dans le total de la suite complète.
      - name: E2E test timing (mock mode)
        run: python -m pytest tests_integration_e2e.py::EndToEndTransferFlowTests -v --durations=0
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: ci-insecure-secret-key-for-testing-only
          DB_NAME: krypt_test
          DB_USER: krypt
          DB_PASSWORD: krypt_secret
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci_minio_key
          MINIO_SECRET_KEY: ci_minio_secret

      # ── Frontend tests (aucun pour l'instant) ─
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npm run --if-present test
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Job — Vérifie la présence du secret Stripe, pour gater integration-tests.
  # Correctif : `secrets` n'est pas utilisable directement dans un `if:` de job
  # (restriction de la plateforme, erreur "Unrecognized named-value: 'secrets'"
  # sinon) — et le contexte `env` d'un job n'est pas non plus disponible dans le
  # `if:` de CE MÊME job (peuplé seulement une fois le job effectivement démarré,
  # donc après évaluation de son propre `if:`). Le pattern recommandé par GitHub
  # pour ce cas exact : un job dédié qui lit le secret dans un step (`secrets` y
  # est autorisé) et expose le résultat via `outputs:` — lisible, lui, depuis le
  # `if:` d'un job en aval via le contexte `needs`, disponible sans ambiguïté.
  # Ne s'exécute que sur workflow_dispatch : inutile de le lancer sur push/PR
  # puisque integration-tests ne se déclenche de toute façon jamais hors de ce
  # cas (condition strictement inchangée par rapport à l'original).
  # ─────────────────────────────────────────────
  check-secrets:
    name: Check integration secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      has_stripe_key: ${{ steps.check.outputs.has_stripe_key }}
    steps:
      - name: Check Stripe secret presence
        id: check
        run: echo "has_stripe_key=${{ secrets.STRIPE_SECRET_KEY != '' }}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # Job — Tests d'intégration + E2E réel (sandboxes réelles : Stripe/Amoy/MTN)
  # Déclenché manuellement (workflow_dispatch) et uniquement si le secret Stripe
  # existe. Hors du pipeline bloquant : n'est pas dans `needs:` du job build.
  # KRYP-37 — regroupe ici `pytest -m e2e_real` (parcours complet, démo/soutenance)
  # avec les tests `@pytest.mark.integration` déjà en place (KRYP-23/25/26) plutôt
  # que de dupliquer un job quasi identique : même gate, mêmes services, mêmes
  # credentials sandbox. Chaque test individuel (integration ou e2e_real) skip
  # proprement si SES propres credentials (Amoy/MTN) manquent, indépendamment du
  # secret Stripe qui gate le job.
  # ─────────────────────────────────────────────
  integration-tests:
    name: Integration & E2E-real tests (sandboxes réelles)
    runs-on: ubuntu-latest
    needs: [check-secrets]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.check-secrets.outputs.has_stripe_key == 'true' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: krypt_test
          POSTGRES_USER: krypt
          POSTGRES_PASSWORD: krypt_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Cf. commentaire du service redis du job "test" — même cause, même
      # correctif (services indépendants par job, pas partagés entre jobs).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run integration tests (Stripe/Amoy/MTN, single-adapter)
        run: python -m pytest -m integration -v
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: ci-insecure-secret-key-for-testing-only
          DB_NAME: krypt_test
          DB_USER: krypt
          DB_PASSWORD: krypt_secret
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci_minio_key
          MINIO_SECRET_KEY: ci_minio_secret
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          MTN_SUBSCRIPTION_KEY: ${{ secrets.MTN_SUBSCRIPTION_KEY }}
          MTN_API_USER: ${{ secrets.MTN_API_USER }}
          MTN_API_KEY: ${{ secrets.MTN_API_KEY }}

      # KRYP-37 — parcours complet avec les vrais adapters (démo/soutenance).
      # Skip proprement (par test) si Amoy/MTN ne sont pas aussi configurés en
      # secrets repo — seul Stripe est requis pour que ce job se déclenche du tout.
      - name: Run E2E test (real mode — Stripe/Amoy/MTN sandboxes)
        run: python -m pytest -m e2e_real -v
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: ci-insecure-secret-key-for-testing-only
          DB_NAME: krypt_test
          DB_USER: krypt
          DB_PASSWORD: krypt_secret
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci_minio_key
          MINIO_SECRET_KEY: ci_minio_secret
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          MTN_SUBSCRIPTION_KEY: ${{ secrets.MTN_SUBSCRIPTION_KEY }}
          MTN_API_USER: ${{ secrets.MTN_API_USER }}
          MTN_API_KEY: ${{ secrets.MTN_API_KEY }}

  # ─────────────────────────────────────────────
  # Job 3 — Build Docker images
  # ─────────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker compose build
        run: docker compose build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
