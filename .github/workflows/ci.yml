name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 — Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Python / flake8 ───────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: flake8 — backend
        run: flake8 backend/config backend/identite backend/conformite --max-line-length=119

      # ── Node / ESLint ─────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint — frontend
        run: npx next lint
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Job 2 — Tests
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: krypt_test
          POSTGRES_USER: krypt
          POSTGRES_PASSWORD: krypt_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ── Django tests ──────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run Django tests
        run: python manage.py test --verbosity=2
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: ci-insecure-secret-key-for-testing-only
          DB_NAME: krypt_test
          DB_USER: krypt
          DB_PASSWORD: krypt_secret
          DB_HOST: localhost
          DB_PORT: "5432"
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci_minio_key
          MINIO_SECRET_KEY: ci_minio_secret

      # ── Frontend tests (aucun pour l'instant) ─
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npm run --if-present test
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Job 3 — Build Docker images
  # ─────────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker compose build
        run: docker compose build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
