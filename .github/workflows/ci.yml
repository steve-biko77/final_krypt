name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Job 1 — Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Python / flake8 ───────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: flake8 — backend
        run: flake8 . --exclude=venv,.venv,migrations --max-line-length=119
        working-directory: backend

      # ── Node / ESLint ─────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint — frontend
        run: npx next lint --no-cache --max-warnings=5
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Job 2 — Tests
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: krypt_test
          POSTGRES_USER: krypt
          POSTGRES_PASSWORD: krypt_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ── Django tests ──────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run Django tests
        run: python manage.py test --verbosity=2
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: ci-insecure-secret-key-for-testing-only
          DB_NAME: krypt_test
          DB_USER: krypt
          DB_PASSWORD: krypt_secret
          DB_HOST: localhost
          DB_PORT: "5432"
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci_minio_key
          MINIO_SECRET_KEY: ci_minio_secret

      # ── KRYP-37 : visibilité dédiée du temps du test E2E (mode mocké) ─
      # Déjà exécuté ci-dessus par `manage.py test` (couverture bloquante) ;
      # ce step ne fait que le ré-exécuter seul via pytest --durations pour que
      # son temps ne soit pas noyé dans le total de la suite complète.
      - name: E2E test timing (mock mode)
        run: python -m pytest tests_integration_e2e.py::EndToEndTransferFlowTests -v --durations=0
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: ci-insecure-secret-key-for-testing-only
          DB_NAME: krypt_test
          DB_USER: krypt
          DB_PASSWORD: krypt_secret
          DB_HOST: localhost
          DB_PORT: "5432"
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci_minio_key
          MINIO_SECRET_KEY: ci_minio_secret

      # ── Frontend tests (aucun pour l'instant) ─
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npm run --if-present test
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Job — Tests d'intégration + E2E réel (sandboxes réelles : Stripe/Amoy/MTN)
  # Déclenché manuellement (workflow_dispatch) et uniquement si le secret Stripe
  # existe. Hors du pipeline bloquant : n'est pas dans `needs:` du job build.
  # KRYP-37 — regroupe ici `pytest -m e2e_real` (parcours complet, démo/soutenance)
  # avec les tests `@pytest.mark.integration` déjà en place (KRYP-23/25/26) plutôt
  # que de dupliquer un job quasi identique : même gate, mêmes services, mêmes
  # credentials sandbox. Chaque test individuel (integration ou e2e_real) skip
  # proprement si SES propres credentials (Amoy/MTN) manquent, indépendamment du
  # secret Stripe qui gate le job.
  # ─────────────────────────────────────────────
  integration-tests:
    name: Integration & E2E-real tests (sandboxes réelles)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && secrets.STRIPE_SECRET_KEY != '' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: krypt_test
          POSTGRES_USER: krypt
          POSTGRES_PASSWORD: krypt_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run integration tests (Stripe/Amoy/MTN, single-adapter)
        run: python -m pytest -m integration -v
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: ci-insecure-secret-key-for-testing-only
          DB_NAME: krypt_test
          DB_USER: krypt
          DB_PASSWORD: krypt_secret
          DB_HOST: localhost
          DB_PORT: "5432"
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci_minio_key
          MINIO_SECRET_KEY: ci_minio_secret
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          MTN_SUBSCRIPTION_KEY: ${{ secrets.MTN_SUBSCRIPTION_KEY }}
          MTN_API_USER: ${{ secrets.MTN_API_USER }}
          MTN_API_KEY: ${{ secrets.MTN_API_KEY }}

      # KRYP-37 — parcours complet avec les vrais adapters (démo/soutenance).
      # Skip proprement (par test) si Amoy/MTN ne sont pas aussi configurés en
      # secrets repo — seul Stripe est requis pour que ce job se déclenche du tout.
      - name: Run E2E test (real mode — Stripe/Amoy/MTN sandboxes)
        run: python -m pytest -m e2e_real -v
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: ci-insecure-secret-key-for-testing-only
          DB_NAME: krypt_test
          DB_USER: krypt
          DB_PASSWORD: krypt_secret
          DB_HOST: localhost
          DB_PORT: "5432"
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci_minio_key
          MINIO_SECRET_KEY: ci_minio_secret
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          MTN_SUBSCRIPTION_KEY: ${{ secrets.MTN_SUBSCRIPTION_KEY }}
          MTN_API_USER: ${{ secrets.MTN_API_USER }}
          MTN_API_KEY: ${{ secrets.MTN_API_KEY }}

  # ─────────────────────────────────────────────
  # Job 3 — Build Docker images
  # ─────────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker compose build
        run: docker compose build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
